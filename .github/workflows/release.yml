# Release automation: every pushed tag builds the Android APK in CI and
# attaches it to a GitHub Release, so installs/updates flow through Obtainium
# without depending on any one build host.
#
# Toolchain pins mirror the local build environment:
#   JDK 21 (temurin) · Gradle 8.9 (wrapper, committed) · NDK 26.3.11579264
#   (also pinned in app/build.gradle.kts) · Rust stable (workspace
#   rust-version = 1.85) · all four shipping ABIs (build.gradle.kts default).
#
# The gradle build drives everything: cargo-ndk cross-compiles
# libthundercrab_ffi.so per ABI, uniffi-bindgen generates the Kotlin surface,
# then assembleDebug packages the APK. CI just provides the tools and runs it.
#
# The asset is uploaded as ThunderCrab-debug.apk — Obtainium trackers key on
# that name; do not rename it.

name: release

on:
  push:
    tags:
      - "v*"
      - "build-*"
      - "interim-*"
  workflow_dispatch: # manual runs upload to a release named for the current ref

permissions:
  contents: write # create the release + upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build + release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest runners ship the Android SDK + sdkmanager; we only need
      # to add the pinned NDK (build.gradle.kts refuses any other version).
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry + tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          # Cargo.lock is intentionally untracked in this repo, so key on the
          # manifests instead.
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Cache gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      # Fresh runners have no debug keystore; the Android debug signing config
      # expects ~/.android/debug.keystore. Generate the well-known fixed debug
      # key (Google's documented defaults) so :app:validateSigningDebug passes.
      # This is the PUBLIC debug key — it grants nothing; release signing is
      # separate and not used here.
      - name: Ensure Android debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (drives cargo-ndk + uniffi-bindgen + gradle)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage asset under its stable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ThunderCrab-debug.apk

      - name: Create release (or reuse) + upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v* tags are releases; build-*/interim-* (and manual runs) are pre-releases.
          PRERELEASE_FLAG="--prerelease"
          case "$TAG" in v*) PRERELEASE_FLAG="" ;; esac
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ThunderCrab $TAG" --generate-notes $PRERELEASE_FLAG
          fi
          gh release upload "$TAG" ThunderCrab-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
