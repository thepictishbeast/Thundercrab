[workspace]
resolver = "2"
members = [
    "thundercrab-core",
    "thundercrab-imap",
    "thundercrab-suggestions",
    "crab-ledger",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/thepictishbeast/thundercrab"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time", "net", "io-util"] }

# IMAP (async client) and TLS. Pinned to stable lines, not bleeding edge —
# this is mail-server-touching code and we want the well-trodden paths.
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto for signed suggestions
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
hex = "0.4"

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP service (used by crab-ledger only)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
http = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
