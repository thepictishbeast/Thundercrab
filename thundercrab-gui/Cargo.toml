[package]
name = "thundercrab-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thundercrab desktop GUI — Iced-backed first window. Composes the IMAP/ManageSieve/SMTP wire layer behind a typed Elm-architecture app."

[[bin]]
name = "thundercrab"
path = "src/main.rs"

[dependencies]
thundercrab-imap = { path = "../thundercrab-imap" }
# Loom→Iced bridge — every magic number / color in this GUI must
# come through here, not as a literal. See thundercrab-theme docs
# for the doctrine and tests/spacing_is_monotonic-style guards.
thundercrab-theme = { path = "../thundercrab-theme" }
# Re-exported via thundercrab-theme so view code can name tokens
# directly (FontSize::H1 etc.); pinned to the same Loom rev as
# the bridge crate to keep them in lockstep.
loom-tokens = { git = "https://github.com/thepictishbeast/PlausiDen-Loom.git", rev = "c285e2e" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Iced is the supersociety pick: pure Rust (no GTK system runtime,
# no WebView), single binary per platform (Linux/macOS/Windows),
# Elm architecture so every state transition is compile-time
# typed. We pay in compile time + binary size; both bounded.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }

[lints]
workspace = true
